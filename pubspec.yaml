name: sajda_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.9+21

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  path_provider: ^2.1.5
  flutter_bloc: ^9.0.0
